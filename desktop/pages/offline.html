<!doctype html><html><head><meta charset="utf-8"><title>KokoDocs</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
:root{color-scheme:light dark;--bg:#fff;--ink:#1a1a1e;--muted:#6a6a74;--line:#dcdce2;--accent:#4f46e5}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1f;--ink:#e6e6ea;--muted:#9a9aa6;--line:#34343c}}
*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
.drag{position:fixed;top:0;left:0;right:0;height:40px;-webkit-app-region:drag}
.card{width:min(460px,90vw);display:grid;gap:14px}h1{margin:0;font-size:24px;letter-spacing:-.02em}p{margin:0;color:var(--muted)}
.row{display:flex;gap:10px}button{padding:11px 16px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}button.o{background:transparent;color:var(--ink);border:1px solid var(--line)}
code{color:var(--muted);font-size:13px}
</style></head><body><div class="drag"></div>
<div class="card"><h1>Can’t reach KokoDocs</h1>
<p>Open the app once while connected and it keeps a copy of everything on this computer, so it works offline from then on.</p>
<code id="w"></code><div class="row"><button onclick="kokoSetup.retry()">Try again</button></div></div>
<script>const q=new URLSearchParams(location.search);document.getElementById('w').textContent=(q.get('server')||'')+(q.get('why')?'  ·  '+q.get('why'):'')</script></body></html>
