<!doctype html><html><head><meta charset="utf-8"><title>KokoDocs</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
:root{color-scheme:light dark;--bg:#fff;--ink:#1a1a1e;--muted:#6a6a74;--line:#dcdce2;--accent:#4f46e5}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1f;--ink:#e6e6ea;--muted:#9a9aa6;--line:#34343c}}
*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
.drag{position:fixed;top:0;left:0;right:0;height:40px;-webkit-app-region:drag}
.card{width:min(440px,90vw);display:grid;gap:14px}h1{margin:0;font-size:26px;letter-spacing:-.02em}p{margin:0;color:var(--muted)}
input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:transparent;color:inherit;font:inherit}
button{padding:12px 16px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.6}
.err{color:#d33;min-height:1.4em}
</style></head><body><div class="drag"></div>
<form class="card" id="f"><h1>Welcome to KokoDocs</h1><p>Enter the address of your KokoDocs server.</p>
<input id="u" placeholder="docs.example.com" autofocus autocomplete="off" spellcheck="false"><div class="err" id="e"></div><button id="b">Continue</button></form>
<script>
const f=document.getElementById('f'),u=document.getElementById('u'),e=document.getElementById('e'),b=document.getElementById('b')
kokoSetup.current().then(v=>{if(v)u.value=v})
f.onsubmit=async(ev)=>{ev.preventDefault();b.disabled=true;e.textContent='';const r=await kokoSetup.save(u.value);if(!r.ok){e.textContent=r.error;b.disabled=false}}
</script></body></html>
